<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — M/S Dayal Fire Works</title>
<meta name="description" content="Track your fireworks orders at M/S Dayal Fire Works.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --panel:#0d0d12; --panel-2:#15151c;
  --fire:#ff6b35; --fire-soft:#ff8c5a;
  --crimson:#e63946; --spark:#ffd700; --spark-soft:#ffe566;
  --ember:#ff9500; --green:#06d6a0;
  --text:#f8f4ee; --muted:#8b94af; --line:rgba(255,255,255,.08);
  --radius:14px;
}
*{box-sizing:border-box;}html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,.display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;} a{color:inherit;} button{font-family:inherit;cursor:pointer;}

.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 15%,rgba(212,175,55,0.08),transparent 50%),radial-gradient(circle at 85% 85%,rgba(227,38,54,0.06),transparent 50%),var(--bg);}

/* Header */
header{
  position:sticky; top:12px; z-index:40; margin:0 16px; border-radius:24px;
  background:rgba(26,26,32,0.65); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(212,175,55,0.15); box-shadow:0 16px 40px rgba(0,0,0,0.5); transition:all 0.3s;
}
.header-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-badge{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 180deg,var(--crimson),var(--spark),var(--fire),var(--crimson));display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 14px rgba(255,107,26,.5);}
.brand-badge span{background:var(--bg);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.brand-text .display{font-size:16px;line-height:1;color:var(--spark-soft);margin:0;}
.brand-text small{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:border-color .2s;}
.back-btn:hover{border-color:var(--fire);color:var(--text);}

/* Auth gate */
.auth-gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-gate-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px 32px;max-width:400px;width:100%;text-align:center;}
.auth-gate-card .icon{font-size:56px;margin-bottom:16px;}
.auth-gate-card h2{font-size:22px;color:var(--spark-soft);margin:0 0 10px;}
.auth-gate-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px;}
.sign-in-btn{display:inline-flex;align-items:center;gap:8px;background:white;color:#333;border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:box-shadow .2s;}
.sign-in-btn:hover{box-shadow:0 4px 22px rgba(0,0,0,.5);}
.sign-in-btn img{width:20px;height:20px;}

/* Page header */
.page-header{max-width:1100px;margin:0 auto;padding:32px 20px 0;}
.page-header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.user-info{display:flex;align-items:center;gap:12px;}
.user-avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--fire);object-fit:cover;}
.user-name{font-size:16px;font-weight:700;color:var(--text);}
.user-email{font-size:12px;color:var(--muted);}
.sign-out-btn{font-size:13px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer;transition:border-color .2s;}
.sign-out-btn:hover{border-color:var(--crimson);color:var(--crimson);}
.page-title{font-size:clamp(26px,5vw,40px);color:var(--spark-soft);margin:16px 0 4px;}
.page-sub{color:var(--muted);font-size:14px;margin:0 0 24px;}

/* Filter bar */
.filter-bar{max-width:1100px;margin:0 auto;padding:0 20px 20px;display:flex;gap:8px;flex-wrap:wrap;}
.filter-chip{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);padding:7px 16px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.filter-chip.active{background:rgba(255,107,26,.15);border-color:var(--fire);color:var(--fire-soft);}

/* Orders list */
.orders-container{max-width:1100px;margin:0 auto;padding:0 20px 60px;}
.loading{text-align:center;color:var(--muted);padding:80px;font-size:14px;}
.empty{text-align:center;padding:80px 20px;}
.empty .icon{font-size:56px;margin-bottom:16px;}
.empty h3{font-size:20px;color:var(--spark-soft);margin:0 0 10px;}
.empty p{color:var(--muted);font-size:14px;margin:0 0 22px;}
.shop-btn{background:linear-gradient(135deg,var(--fire),var(--crimson));color:#fff;border:none;padding:13px 24px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}

/* Order card */
.order-card{
  background:linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border:1px solid rgba(255,255,255,0.06); border-radius:20px;
  overflow:hidden;margin-bottom:18px;transition:transform .3s, box-shadow .3s, border-color .3s;
  backdrop-filter:blur(10px);
}
.order-card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,0.4);box-shadow:0 12px 40px rgba(212,175,55,0.15);}
.order-card-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);}
.order-id-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.order-id{font-family:'JetBrains Mono';font-size:13px;font-weight:700;color:var(--spark);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.order-date{font-size:12px;color:var(--muted);margin-top:3px;}
.order-total-line{font-family:'JetBrains Mono';font-size:18px;font-weight:700;color:var(--spark-soft);}

.order-card-body{padding:16px 20px;}

/* Bill table */
.bill-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;}
.bill-table thead th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;}
.bill-table thead th:last-child{text-align:right;}
.bill-table tbody td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.bill-table tbody tr:last-child td{border-bottom:none;}
.bill-item-name{font-weight:600;color:var(--text);}
.bill-item-unit{font-size:11px;color:var(--muted);margin-top:2px;}
.bill-qty{font-family:'JetBrains Mono';font-size:12px;color:var(--muted);text-align:center;}
.bill-rate{font-family:'JetBrains Mono';font-size:12px;color:var(--muted);text-align:right;}
.bill-amount{font-family:'JetBrains Mono';font-size:13px;font-weight:700;color:var(--spark-soft);text-align:right;}
.bill-total-row{background:rgba(245,197,24,.06);}
.bill-total-row td{padding:10px 8px;font-weight:700;font-size:13px;color:var(--spark-soft);border-top:1px solid var(--line);}
.bill-total-label{font-family:'Anton';letter-spacing:.5px;text-transform:uppercase;}
.bill-note{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--muted);margin-bottom:14px;font-style:italic;}

/* Status timeline */
.status-timeline{display:flex;align-items:center;gap:0;margin:4px 0 0;overflow-x:auto;padding-bottom:4px;}
.status-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px;position:relative;}
.status-step::before{content:'';position:absolute;top:12px;left:-50%;right:50%;height:2px;background:var(--line);}
.status-step:first-child::before{display:none;}
.status-step.done::before{background:var(--green);}
.status-step.active::before{background:linear-gradient(to right,var(--green),var(--fire));}
.step-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;margin-bottom:5px;transition:all .3s;}
.status-step.done .step-dot{background:var(--green);border-color:var(--green);color:#002210;}
.status-step.active .step-dot{background:var(--fire);border-color:var(--fire);color:#fff;box-shadow:0 0 10px rgba(255,85,0,.5);}
.status-step.cancelled .step-dot{background:var(--crimson);border-color:var(--crimson);color:#fff;}
.step-label{font-size:9px;color:var(--muted);text-align:center;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.status-step.done .step-label,.status-step.active .step-label{color:var(--text);}

.order-card-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.whatsapp-contact{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#04210f;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;border:none;cursor:pointer;}

@media(max-width:520px){
  header { margin:0; border-radius:0; border-left:none; border-right:none; border-top:none; }
  .order-card-header{flex-direction:column;align-items:flex-start;}
  .bill-rate{display:none;}
  .bill-table thead th:nth-child(3){display:none;}
}
</style>
</head>
<body>
<div class="sky"></div>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <div class="brand-badge"><span>🧨</span></div>
      <div class="brand-text">
        <p class="display">Dayal Fire Works</p>
        <small>Wholesale Cracker Godown</small>
      </div>
    </a>
    <a href="index.html" class="back-btn">← Back to Shop</a>
  </div>
</header>

<!-- Sign-in gate (shown when not logged in) -->
<div class="auth-gate" id="authGate">
  <div class="auth-gate-card">
    <div class="icon">📦</div>
    <h2>Track Your Orders</h2>
    <p>Sign in with your Google account to see all your past orders and their live status — from New to Delivered.</p>
    <button class="sign-in-btn" id="signInBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
      Sign in with Google
    </button>
  </div>
</div>

<!-- Main content (shown when signed in) -->
<div id="mainContent" style="display:none;">
  <div class="page-header">
    <div class="page-header-inner">
      <div class="user-info">
        <img class="user-avatar" id="userAvatar" src="" alt="">
        <div>
          <div class="user-name" id="userName"></div>
          <div class="user-email" id="userEmail"></div>
        </div>
      </div>
      <button class="sign-out-btn" id="signOutBtn">Sign Out</button>
    </div>
    <h1 class="page-title">My Orders</h1>
    <p class="page-sub">All your orders with live status updates</p>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-chip active" data-filter="all">All Orders</button>
    <button class="filter-chip" data-filter="New">New</button>
    <button class="filter-chip" data-filter="Confirmed">Confirmed</button>
    <button class="filter-chip" data-filter="Ready for Pickup">Ready for Pickup</button>
    <button class="filter-chip" data-filter="Delivered">Delivered</button>
  </div>

  <div class="orders-container" id="ordersContainer">
    <div class="loading" id="ordersLoading">⏳ Loading your orders…</div>
    <div id="ordersList"></div>
  </div>
</div>

<script src="store.js"></script>
<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, onSnapshot }
                              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { firebaseConfig }   from './firebase-config.js';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

let allOrders   = [];
let activeFilter= 'all';
let unsubscribe = null;

const STATUSES = ['New','Confirmed','Ready for Pickup','Delivered'];

onAuthStateChanged(auth, user => {
  if (user){
    document.getElementById('authGate').style.display  = 'none';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('userAvatar').src  = user.photoURL||'';
    document.getElementById('userName').textContent  = user.displayName||user.email;
    document.getElementById('userEmail').textContent = user.email;
    subscribeOrders(user.uid);
  } else {
    document.getElementById('authGate').style.display  = 'flex';
    document.getElementById('mainContent').style.display = 'none';
    if (unsubscribe){ unsubscribe(); unsubscribe=null; }
  }
});

document.getElementById('signInBtn').addEventListener('click', async ()=>{
  try{ await signInWithPopup(auth, provider); }catch(e){}
});
document.getElementById('signOutBtn').addEventListener('click', ()=>signOut(auth));

function subscribeOrders(uid){
  document.getElementById('ordersLoading').style.display='block';
  document.getElementById('ordersList').innerHTML='';
  // Use simple query (no composite index needed) + sort client-side
  const q = query(collection(db,'orders'), where('customerUid','==',uid));
  unsubscribe = onSnapshot(q, snap => {
    allOrders = snap.docs.map(d=>{
      const data=d.data();
      return {...data, _docId:d.id, placedAt:data.placedAt?.toDate?.()};
    });
    // Sort newest first client-side
    allOrders.sort((a,b)=>(b.placedAt||0)-(a.placedAt||0));
    document.getElementById('ordersLoading').style.display='none';
    renderOrders();
  }, err => {
    document.getElementById('ordersLoading').innerHTML='⚠ Could not load orders. Please refresh.';
  });
}

// ── Filter chips ──
document.getElementById('filterBar').querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.filter;
    renderOrders();
  });
});

function renderOrders(){
  const list=document.getElementById('ordersList');
  let orders=allOrders;
  if(activeFilter!=='all') orders=orders.filter(o=>o.status===activeFilter);

  if(!orders.length){
    list.innerHTML=`<div class="empty">
      <div class="icon">${activeFilter==='all'?'🎆':'🔍'}</div>
      <h3>${activeFilter==='all'?'No orders yet':'No '+activeFilter+' orders'}</h3>
      <p>${activeFilter==='all'?'Once you place an order, it will appear here with live status updates.':'Try a different filter.'}</p>
      ${activeFilter==='all'?`<a href="index.html" class="shop-btn">🧨 Browse the Shop</a>`:''}
    </div>`;
    return;
  }
  list.innerHTML=orders.map(o=>orderCardHTML(o)).join('');

  // WhatsApp contact buttons
  list.querySelectorAll('[data-whatsapp]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const settings=dfw_getSettings();
      const msg=`Hello, I'm following up on my order *${btn.dataset.whatsapp}*. Please update me on the status.`;
      window.open('https://wa.me/'+settings.whatsapp+'?text='+encodeURIComponent(msg),'_blank');
    });
  });
}

function orderCardHTML(o){
  const items=Array.isArray(o.items)?o.items:[];
  const color=dfw_statusColor(o.status); const bg=dfw_statusBg(o.status);
  const date=o.placedAt?o.placedAt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'—';
  const isCancelled=o.status==='Cancelled';

  // Bill table
  const billRows=items.map(it=>`<tr>
    <td><div class="bill-item-name">${dfw_escapeHTML(it.name)}</div><div class="bill-item-unit">${dfw_escapeHTML(it.unit)}</div></td>
    <td class="bill-qty">${it.qty}</td>
    <td class="bill-rate">${dfw_formatINR(it.price)}</td>
    <td class="bill-amount">${dfw_formatINR(it.price*it.qty)}</td>
  </tr>`).join('');

  // Timeline
  const timelineHtml=isCancelled
    ? `<div class="status-timeline"><div class="status-step cancelled"><div class="step-dot">✕</div><div class="step-label">Cancelled</div></div></div>`
    : `<div class="status-timeline">${STATUSES.map((s,i)=>{
        const sIdx=STATUSES.indexOf(o.status);
        const cls=i<sIdx?'done':i===sIdx?'active':'';
        const icons=['📋','✅','📦','🎉'];
        return `<div class="status-step ${cls}"><div class="step-dot">${icons[i]}</div><div class="step-label">${s}</div></div>`;
      }).join('')}</div>`;

  return `<div class="order-card">
    <div class="order-card-header">
      <div>
        <div class="order-id-line">
          <span class="order-id">${o.orderId||o._docId}</span>
          <span class="status-badge" style="color:${color};background:${bg}"><span class="status-dot" style="background:${color}"></span>${dfw_escapeHTML(o.status||'New')}</span>
        </div>
        <div class="order-date">📅 ${date}${o.customerName?'  ·  👤 '+o.customerName:''}</div>
      </div>
      <div class="order-total-line">${dfw_formatINR(o.total||0)}</div>
    </div>
    <div class="order-card-body">
      ${o.note?`<div class="bill-note">Note: ${dfw_escapeHTML(o.note)}</div>`:''}
      <table class="bill-table">
        <thead><tr>
          <th>Product</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Amount</th>
        </tr></thead>
        <tbody>${billRows}</tbody>
        <tfoot><tr class="bill-total-row">
          <td colspan="3" class="bill-total-label">Grand Total</td>
          <td class="bill-amount" style="font-size:15px;">${dfw_formatINR(o.total||0)}</td>
        </tr></tfoot>
      </table>
      ${timelineHtml}
    </div>
    <div class="order-card-footer">
      <div style="font-size:12px;color:var(--muted);">Need help? Contact us on WhatsApp</div>
      <button class="whatsapp-contact" data-whatsapp="${o.orderId||o._docId}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </button>
    </div>
  </div>`;
}
</script>
</body>
</html>
