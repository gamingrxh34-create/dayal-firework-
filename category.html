<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category — M/S Dayal Fire Works</title>
<meta name="description" content="Browse fireworks products by category at M/S Dayal Fire Works.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070e;
    --panel:#0f0f1e;
    --panel-2:#151528;
    --fire:#ff6b1a;
    --fire-soft:#ff9a4d;
    --crimson:#e01a2e;
    --spark:#ffd700;
    --spark-soft:#ffe566;
    --ember:#ff8c00;
    --green:#2dba6a;
    --text:#f5f0e8;
    --muted:#8b92b8;
    --line:rgba(255,107,26,0.18);
    --glow:rgba(255,107,26,0.3);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.5px; text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}

  /* ── Background ── */
  .sky{position:fixed; inset:0; z-index:-2; background:var(--bg);}
  .sky-gradient{position:fixed; inset:0; z-index:-2;}
  .particles{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
  .particles span{position:absolute; border-radius:50%; animation:emberFloat linear infinite;}
  @keyframes emberFloat{
    0%{opacity:0;transform:translateY(0) scale(1);}
    15%{opacity:1;}
    85%{opacity:0.6;}
    100%{opacity:0;transform:translateY(-120vh) scale(0.3);}
  }

  /* ── Header ── */
  header{
    position:sticky; top:0; z-index:40;
    background:rgba(7,7,14,0.88); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1200px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-badge{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(from 180deg, var(--crimson), var(--spark), var(--fire), var(--crimson));
    display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;
    box-shadow:0 0 16px rgba(255,107,26,0.5);
  }
  .brand-badge span,.brand-badge img{background:var(--bg);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;object-fit:cover;}
  .brand-text .display{font-size:20px;line-height:1;color:var(--spark-soft);margin:0;}
  .brand-text small{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .phone-pill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;}
  .phone-pill strong{color:var(--spark-soft);font-weight:600;}
  .cart-btn{
    position:relative; background:var(--crimson); color:#fff; border:none;
    padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 18px rgba(224,26,46,0.45); transition:box-shadow .2s;
  }
  .cart-btn:hover{box-shadow:0 4px 24px rgba(224,26,46,0.65);}
  .cart-count{
    position:absolute; top:-8px; right:-8px; background:var(--spark);
    color:#1a0900; font-size:11px; font-weight:800; min-width:20px; height:20px;
    border-radius:50%; display:flex;align-items:center;justify-content:center;
    border:2px solid var(--bg);
  }

  /* ── Category Hero ── */
  .cat-hero{
    position:relative; overflow:hidden;
    min-height:260px; display:flex; align-items:flex-end;
    padding:40px 20px 36px;
  }
  .cat-hero-bg{
    position:absolute; inset:0; z-index:0;
    background-size:cover; background-position:center;
  }
  .cat-hero-overlay{
    position:absolute; inset:0; z-index:1;
  }
  .cat-hero-content{
    position:relative; z-index:2;
    max-width:1200px; margin:0 auto; width:100%;
  }
  .cat-hero-icon{font-size:56px; margin-bottom:12px; filter:drop-shadow(0 0 20px rgba(255,140,0,0.9)); display:block;}
  .cat-hero-title{font-size:clamp(32px,6vw,64px); color:var(--text); margin:0 0 8px; line-height:1; text-shadow:0 2px 20px rgba(0,0,0,0.6);}
  .cat-hero-sub{font-size:15px; color:rgba(245,240,232,0.8); margin:0 0 16px; font-weight:500;}
  .cat-hero-stats{display:flex; gap:16px; flex-wrap:wrap;}
  .cat-stat{
    background:rgba(7,7,14,0.6); backdrop-filter:blur(8px);
    border:1px solid rgba(255,107,26,0.3); border-radius:8px;
    padding:8px 16px; font-size:13px; font-weight:600; color:var(--spark-soft);
  }

  /* ── Breadcrumb ── */
  .breadcrumb{
    max-width:1200px; margin:0 auto; padding:16px 20px 0;
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
  }
  .breadcrumb a{color:var(--fire-soft); text-decoration:none; font-weight:600;}
  .breadcrumb a:hover{color:var(--spark);}
  .breadcrumb span{opacity:0.5;}

  /* ── Filter bar ── */
  .filter-bar{
    max-width:1200px; margin:0 auto; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .filter-bar h2{font-size:16px; color:var(--spark-soft); margin:0;}
  .filter-bar-right{display:flex; gap:10px; align-items:center;}
  .filter-chip{
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:7px 14px; border-radius:99px; font-size:12px; font-weight:600; cursor:pointer;
    transition:all .15s;
  }
  .filter-chip.active{background:rgba(255,107,26,0.15); border-color:var(--fire); color:var(--fire-soft);}
  .sort-select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer;
  }

  /* ── Product Grid ── */
  .product-section{max-width:1200px; margin:0 auto; padding:0 20px 80px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  .card:hover{transform:translateY(-5px); border-color:rgba(255,107,26,0.5); box-shadow:0 12px 40px rgba(255,107,26,0.2);}
  .card .badge{
    position:absolute; top:10px; left:10px; background:var(--crimson); color:#fff;
    font-size:10px; font-weight:800; padding:4px 9px; border-radius:99px;
    text-transform:uppercase; letter-spacing:0.4px; z-index:2;
    box-shadow:0 2px 8px rgba(224,26,46,0.5);
  }
  .card .badge.green{background:var(--green); color:#002210;}
  .card .out-badge{
    position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.75); color:var(--muted);
    font-size:10px; font-weight:700; padding:4px 9px; border-radius:99px; z-index:2;
  }
  .card .thumb{aspect-ratio:1/1; background:var(--panel-2); position:relative; overflow:hidden;}
  .card .thumb::after{
    content:''; position:absolute; bottom:0; left:0; right:0; height:14px;
    background:radial-gradient(circle at 8px 0, transparent 7px, var(--panel) 7.5px) 0 0/16px 100% repeat-x;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease;}
  .card:hover .thumb img{transform:scale(1.07);}
  .card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-body h3{font-size:14px;font-family:'Inter';font-weight:700;text-transform:none;letter-spacing:0;margin:0;line-height:1.3;}
  .card-body .unit{font-size:11px;color:var(--muted);}
  .card-body .desc{font-size:12px;color:var(--muted);line-height:1.5;margin:2px 0 0;}
  .price-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;}
  .price{font-family:'JetBrains Mono';font-weight:700;color:var(--spark-soft);font-size:17px;}
  .qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .qty-stepper button{background:var(--panel-2);border:none;color:var(--text);width:28px;height:28px;font-size:15px;font-weight:700;transition:background .15s;}
  .qty-stepper button:hover{background:rgba(255,107,26,0.2);}
  .qty-stepper span{width:28px;text-align:center;font-size:13px;font-family:'JetBrains Mono';}
  .add-btn{
    margin-top:10px;width:100%;padding:10px;border:none;border-radius:8px;
    background:linear-gradient(135deg,var(--fire),var(--crimson));color:#fff;
    font-weight:700;font-size:13px;
    box-shadow:0 4px 14px rgba(255,107,26,0.3);
    transition:box-shadow .2s, opacity .2s;
  }
  .add-btn:hover{box-shadow:0 4px 20px rgba(255,107,26,0.55);}
  .add-btn:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;box-shadow:none;}
  .add-btn.added{background:linear-gradient(135deg,var(--green),#1a8a50);}
  .no-results{text-align:center;color:var(--muted);padding:80px 0;font-size:14px;}
  .loading-state{text-align:center;color:var(--muted);padding:80px 0;font-size:14px;}

  /* ── Overlay + Drawer ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:49;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(420px,100%);
    background:var(--panel);border-left:1px solid var(--line);z-index:50;
    transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .drawer-header h2{font-size:18px;margin:0;color:var(--spark-soft);}
  .close-btn{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .cart-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-info h4{font-size:13px;margin:0 0 2px;font-weight:600;}
  .cart-item .ci-info .unit{font-size:11px;color:var(--muted);}
  .cart-item .ci-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .remove-link{font-size:11px;color:var(--crimson);background:none;border:none;text-decoration:underline;cursor:pointer;}
  .empty-cart{text-align:center;color:var(--muted);padding:60px 10px;font-size:14px;}
  .drawer-footer{border-top:1px solid var(--line);padding:16px 20px 20px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:13px;font-family:inherit;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--fire);}
  .field textarea{resize:vertical;min-height:50px;}
  .subtotal-row{display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;font-size:15px;}
  .subtotal-row .price{font-size:20px;}
  .whatsapp-btn{
    width:100%;padding:14px;border:none;border-radius:10px;background:#25D366;color:#04210f;
    font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .whatsapp-btn:disabled{background:var(--panel-2);color:var(--muted);}
  .error-text{color:var(--crimson);font-size:11px;margin-top:-6px;margin-bottom:8px;}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--spark);border-radius:16px;
    max-width:440px;width:100%;padding:30px 26px;text-align:center;
    box-shadow:0 0 60px rgba(255,215,0,0.15);
  }
  .modal .check{width:60px;height:60px;border-radius:50%;background:rgba(45,186,106,0.15);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;}
  .modal h2{font-size:20px;margin:0 0 8px;color:var(--spark-soft);}
  .modal p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px;}
  .modal .order-id{font-family:'JetBrains Mono';color:var(--spark);font-size:13px;margin-bottom:16px;}
  .modal .order-summary{text-align:left;background:var(--panel-2);border-radius:10px;padding:14px;font-size:13px;margin-bottom:18px;max-height:180px;overflow-y:auto;}
  .modal .order-summary div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted);}
  .modal .order-summary div b{color:var(--text);font-weight:500;}
  .btn-primary{
    background:linear-gradient(135deg,var(--spark),var(--ember));
    color:#1a0900;border:none;padding:14px 26px;border-radius:10px;font-weight:800;font-size:15px;
    box-shadow:0 4px 16px rgba(255,215,0,0.3);cursor:pointer;
  }

  /* ── Other cats strip ── */
  .other-cats{max-width:1200px; margin:0 auto; padding:30px 20px 0;}
  .other-cats h3{font-size:15px; color:var(--muted); margin:0 0 14px; text-transform:uppercase; letter-spacing:1.5px;}
  .cats-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .cat-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:99px;
    padding:8px 14px; font-size:13px; font-weight:600; text-decoration:none; color:var(--muted);
    transition:all .15s;
  }
  .cat-chip:hover{border-color:var(--fire); color:var(--fire-soft); box-shadow:0 0 12px rgba(255,107,26,0.2);}

  @media(max-width:640px){
    .cat-hero{min-height:200px;}
    .cat-hero-icon{font-size:40px;}
    .filter-bar{flex-direction:column; align-items:flex-start;}
  }
  @media(prefers-reduced-motion:reduce){.particles span{animation:none !important;}}
</style>
</head>
<body>

<div class="sky"></div>
<div class="sky-gradient" id="skyGradient"></div>
<div class="particles" id="particles"></div>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-badge" id="brandBadge"><span>🧨</span></div>
      <div class="brand-text">
        <p class="display" id="brandName">Dayal Fire Works</p>
        <small id="brandTagline">Wholesale Cracker Godown</small>
      </div>
    </div>
    <div class="header-actions">
      <div class="phone-pill" id="headerPhone">📞 <strong>...</strong></div>
      <button class="cart-btn" id="openCartBtn">
        🛒 Cart <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<!-- HERO -->
<div class="cat-hero" id="catHero">
  <div class="cat-hero-bg" id="catHeroBg"></div>
  <div class="cat-hero-overlay" id="catHeroOverlay"></div>
  <div class="cat-hero-content">
    <span class="cat-hero-icon" id="catHeroIcon">🧨</span>
    <h1 class="cat-hero-title" id="catHeroTitle">Category</h1>
    <p class="cat-hero-sub" id="catHeroSub">Loading products…</p>
    <div class="cat-hero-stats" id="catHeroStats"></div>
  </div>
</div>

<!-- BREADCRUMB -->
<div class="breadcrumb">
  <a href="index.html">🏠 Home</a>
  <span>›</span>
  <span id="breadcrumbCat">Category</span>
</div>

<!-- FILTER / SORT BAR -->
<div class="filter-bar">
  <h2 id="filterBarTitle">All Products</h2>
  <div class="filter-bar-right">
    <button class="filter-chip active" id="filterAll">All</button>
    <button class="filter-chip" id="filterInStock">In Stock Only</button>
    <select class="sort-select" id="sortSelect">
      <option value="default">Sort: Default</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="name-asc">Name: A–Z</option>
    </select>
  </div>
</div>

<!-- PRODUCTS -->
<div class="product-section">
  <div class="grid" id="productGrid">
    <div class="loading-state" style="grid-column:1/-1;">⏳ Loading products…</div>
  </div>
</div>

<!-- OTHER CATEGORIES -->
<div class="other-cats" id="otherCatsSection">
  <h3>More Categories</h3>
  <div class="cats-strip" id="catsStrip"></div>
</div>

<div style="height:40px;"></div>

<!-- Cart Drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>Your Order</h2>
    <button class="close-btn" id="closeDrawer">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</aside>

<!-- Order Confirmation Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="check">✓</div>
    <h2>Order Sent!</h2>
    <p>Your order has been opened in WhatsApp. Tap <b>send</b> in WhatsApp to deliver it to us.</p>
    <div class="order-id" id="modalOrderId"></div>
    <div class="order-summary" id="modalSummary"></div>
    <button class="btn-primary" id="modalCloseBtn" style="width:100%;">Continue Shopping</button>
  </div>
</div>

<script src="store.js"></script>
<script>
(function(){
  // ── Read category from URL ──
  const params   = new URLSearchParams(window.location.search);
  const catName  = params.get('cat') || '';

  const settings = DFWStore.getSettings();
  let products   = DFWStore.getProducts();
  let cart       = DFWStore.getCart();
  let showInStockOnly = false;
  let sortMode        = 'default';

  // Category gradient palette
  const CAT_THEMES = {
    'Sparklers':        { bg:'linear-gradient(135deg,#1a0a00,#2a1500,#1a0a00)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(255,140,0,0.15), transparent)' },
    'Ground Chakras':   { bg:'linear-gradient(135deg,#0f0020,#1a0035,#0f0020)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(150,50,255,0.1), transparent)' },
    'Flower Pots':      { bg:'linear-gradient(135deg,#200008,#350010,#200008)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(224,26,46,0.2), transparent)' },
    'Rockets':          { bg:'linear-gradient(135deg,#001020,#001a35,#001020)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(30,100,200,0.15), transparent)' },
    'Sound Crackers':   { bg:'linear-gradient(135deg,#200500,#350800,#200500)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(255,80,0,0.2), transparent)' },
    'Fancy & Fountains':{ bg:'linear-gradient(135deg,#10001a,#1a001a,#10001a)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(200,50,200,0.15), transparent)' },
    'Gift Boxes':       { bg:'linear-gradient(135deg,#1a1000,#2a1800,#1a1000)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(255,200,0,0.18), transparent)' },
    'Green Crackers':   { bg:'linear-gradient(135deg,#001a08,#002a10,#001a08)', overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(45,186,106,0.2), transparent)' },
  };

  const theme = CAT_THEMES[catName] || {
    bg:'linear-gradient(135deg,#0f0000,#1a0800)',
    overlay:'linear-gradient(to top, rgba(7,7,14,0.9), rgba(255,107,26,0.15), transparent)'
  };

  // Apply hero gradient
  document.getElementById('catHeroBg').style.background = theme.bg;
  document.getElementById('catHeroOverlay').style.background = theme.overlay;
  document.getElementById('skyGradient').style.background = theme.bg;

  // ── Page title and meta ──
  document.title = (catName || 'Products') + ' — M/S Dayal Fire Works';

  // ── Header / settings ──
  document.getElementById('brandName').textContent   = settings.shopName;
  document.getElementById('brandTagline').textContent = settings.tagline;
  document.getElementById('headerPhone').innerHTML   = '📞 <strong>' + (settings.altPhones[0]||'') + '</strong>';
  if (settings.logoImage){
    document.getElementById('brandBadge').innerHTML = `<img src="${settings.logoImage}" alt="logo">`;
  }

  // ── Ember particles ──
  const particlesEl = document.getElementById('particles');
  const emberColors = ['#ffd700','#ff9500','#ff6b1a','#e01a2e','#ffe566','#ffb347'];
  for (let i = 0; i < 50; i++){
    const s = document.createElement('span');
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      left:${Math.random()*100}%;
      bottom:${Math.random()*20}%;
      width:${size}px; height:${size}px;
      background:${emberColors[Math.floor(Math.random()*emberColors.length)]};
      box-shadow:0 0 ${size*3}px ${emberColors[Math.floor(Math.random()*emberColors.length)]};
      animation-delay:${Math.random()*6}s;
      animation-duration:${Math.random()*5+4}s;
    `;
    particlesEl.appendChild(s);
  }

  // ── Try to load fresh from backend ──
  (async () => {
    try {
      if (DFWStore.getApiUrl()) {
        const fresh = await DFWStore.fetchProducts();
        if (fresh && fresh.length > 0) {
          products = fresh;
          renderAll();
        }
      }
    } catch(e){}
  })();

  // ── Render hero ──
  function renderHero(){
    const catProducts = products.filter(p => p.category === catName);
    const inStock     = catProducts.filter(p => p.stock).length;

    document.getElementById('catHeroIcon').textContent  = dfw_categoryIcon(catName);
    document.getElementById('catHeroTitle').textContent = catName || 'All Products';
    document.getElementById('breadcrumbCat').textContent = catName;
    document.getElementById('catHeroSub').textContent   =
      `${catProducts.length} product${catProducts.length!==1?'s':''} available at wholesale prices`;

    document.getElementById('catHeroStats').innerHTML = `
      <div class="cat-stat">🛒 ${catProducts.length} Products</div>
      <div class="cat-stat">✅ ${inStock} In Stock</div>
    `;
    document.getElementById('filterBarTitle').textContent = catName + ' — ' + catProducts.length + ' Products';
  }

  // ── Render products ──
  function getVisibleProducts(){
    let list = products.filter(p => p.category === catName);
    if (showInStockOnly) list = list.filter(p => p.stock);
    if (sortMode === 'price-asc')  list = [...list].sort((a,b)=>a.price-b.price);
    if (sortMode === 'price-desc') list = [...list].sort((a,b)=>b.price-a.price);
    if (sortMode === 'name-asc')   list = [...list].sort((a,b)=>a.name.localeCompare(b.name));
    return list;
  }

  function renderProducts(){
    const grid = document.getElementById('productGrid');
    const list = getVisibleProducts();

    if (list.length === 0){
      grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;">😔 No products found in this category.</div>';
      return;
    }

    grid.innerHTML = list.map(p => {
      const qty = cart[p.id] ? cart[p.id].qty : 0;
      const isGreen = p.badge && p.badge.toLowerCase().includes('green');
      return `
        <div class="card">
          ${p.badge ? `<span class="badge ${isGreen?'green':''}">${p.badge}</span>` : ''}
          ${!p.stock ? `<span class="out-badge">Out of stock</span>` : ''}
          <div class="thumb"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="unit">${p.unit}</div>
            ${p.description ? `<div class="desc">${p.description}</div>` : ''}
            <div class="price-row">
              <span class="price">${DFWStore.formatINR(p.price)}</span>
              <div class="qty-stepper">
                <button data-dec="${p.id}">−</button>
                <span id="qty-${p.id}">${qty}</span>
                <button data-inc="${p.id}">+</button>
              </div>
            </div>
            <button class="add-btn" data-add="${p.id}" ${!p.stock?'disabled':''}>${p.stock?'Add to Cart':'Unavailable'}</button>
          </div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.inc, 1)));
    grid.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.dec,-1)));
    grid.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.add)));
  }

  // ── Other categories strip ──
  function renderOtherCats(){
    const allCats = [...new Set(products.map(p=>p.category))].filter(c=>c!==catName);
    const strip   = document.getElementById('catsStrip');
    strip.innerHTML = allCats.map(cat =>
      `<a href="category.html?cat=${encodeURIComponent(cat)}" class="cat-chip">
        ${dfw_categoryIcon(cat)} ${cat}
      </a>`
    ).join('');
    if (allCats.length === 0) document.getElementById('otherCatsSection').style.display = 'none';
  }

  function renderAll(){
    renderHero();
    renderProducts();
    renderOtherCats();
  }
  renderAll();

  // ── Qty controls ──
  function changeQty(id, delta){
    const el = document.getElementById('qty-'+id);
    if (!el) return;
    el.textContent = Math.max(0, Math.min(99, parseInt(el.textContent,10) + delta));
  }

  // ── Add to cart ──
  function addToCart(id){
    const el  = document.getElementById('qty-'+id);
    let qty = el ? parseInt(el.textContent, 10) : 1;
    if (qty < 1) qty = 1;
    const p = products.find(x=>x.id===id);
    if (!p || !p.stock) return;
    if (!cart[id]) cart[id] = { id, name:p.name, unit:p.unit, price:p.price, image:p.image, qty:0 };
    cart[id].qty += qty;
    DFWStore.saveCart(cart);
    updateCartCount();
    if (el) el.textContent = 0;
    const btn = document.querySelector(`[data-add="${id}"]`);
    if (btn){ btn.textContent = 'Added ✓'; btn.classList.add('added'); setTimeout(()=>{ btn.textContent='Add to Cart'; btn.classList.remove('added'); }, 900); }
    renderDrawer();
  }

  function updateCartCount(){
    document.getElementById('cartCount').textContent = Object.values(cart).reduce((s,i)=>s+i.qty,0);
  }
  updateCartCount();

  // ── Filter/sort controls ──
  document.getElementById('filterAll').addEventListener('click', ()=>{
    showInStockOnly = false;
    document.getElementById('filterAll').classList.add('active');
    document.getElementById('filterInStock').classList.remove('active');
    renderProducts();
  });
  document.getElementById('filterInStock').addEventListener('click', ()=>{
    showInStockOnly = true;
    document.getElementById('filterInStock').classList.add('active');
    document.getElementById('filterAll').classList.remove('active');
    renderProducts();
  });
  document.getElementById('sortSelect').addEventListener('change', e=>{
    sortMode = e.target.value;
    renderProducts();
  });

  // ── Cart drawer ──
  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  document.getElementById('openCartBtn').addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('show'); renderDrawer(); }
  function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('show'); }

  function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0); }

  function renderDrawer(){
    const items = Object.values(cart);
    const body  = document.getElementById('drawerBody');
    const foot  = document.getElementById('drawerFooter');
    if (items.length === 0){
      body.innerHTML = `<div class="empty-cart">🎇<br><br>Your cart is empty.<br>Add some crackers to get started!</div>`;
      foot.innerHTML = '';
      updateCartCount();
      return;
    }
    body.innerHTML = items.map(i=>`
      <div class="cart-item">
        <img src="${i.image}" alt="${i.name}">
        <div class="ci-info">
          <h4>${i.name}</h4>
          <div class="unit">${i.unit} · ${DFWStore.formatINR(i.price)}</div>
          <div class="ci-actions">
            <div class="qty-stepper">
              <button data-cdec="${i.id}">−</button>
              <span class="mono">${i.qty}</span>
              <button data-cinc="${i.id}">+</button>
            </div>
            <span class="price" style="font-size:13px;">${DFWStore.formatINR(i.price*i.qty)}</span>
          </div>
          <button class="remove-link" data-remove="${i.id}">Remove</button>
        </div>
      </div>
    `).join('');
    foot.innerHTML = `
      <div class="field"><label>Your Name</label>
        <input type="text" id="custName" placeholder="e.g. Rahul Sharma" value="${localStorage.getItem('dfw_temp_name')||''}"></div>
      <div class="field"><label>Your Phone Number</label>
        <input type="tel" id="custPhone" placeholder="e.g. 98765 43210" value="${localStorage.getItem('dfw_phone')||''}"></div>
      <div class="field"><label>Note (optional)</label>
        <textarea id="custNote" placeholder="Delivery address, timing, etc."></textarea></div>
      <div id="cartError" class="error-text" style="display:none;"></div>
      <div class="subtotal-row"><span>Subtotal</span><span class="price">${dfw_formatINR(cartTotal())}</span></div>
      <button class="whatsapp-btn" id="sendOrderBtn">📩 Send Order on WhatsApp</button>
    `;
    body.querySelectorAll('[data-cinc]').forEach(b=>b.addEventListener('click',()=>{ cart[b.dataset.cinc].qty++; dfw_saveCart(cart); renderDrawer(); }));
    body.querySelectorAll('[data-cdec]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.cdec; cart[id].qty--;
      if(cart[id].qty<=0) delete cart[id];
      dfw_saveCart(cart); renderDrawer(); renderProducts();
    }));
    body.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{
      delete cart[b.dataset.remove]; dfw_saveCart(cart); renderDrawer(); renderProducts();
    }));
    document.getElementById('sendOrderBtn').addEventListener('click', sendOrder);
    updateCartCount();
  }

  async function sendOrder(){
    const name  = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const note  = document.getElementById('custNote').value.trim();
    const errEl = document.getElementById('cartError');
    if (!name||!phone){ errEl.style.display='block'; errEl.textContent='Please enter your name and phone number.'; return; }
    if (!/^[0-9+\-\s]{7,15}$/.test(phone)){ errEl.style.display='block'; errEl.textContent='Please enter a valid phone number.'; return; }
    errEl.style.display='none';

    const sendBtn = document.getElementById('sendOrderBtn');
    sendBtn.disabled=true; sendBtn.textContent='⏳ Placing order…';

    localStorage.setItem('dfw_temp_name', name);
    localStorage.setItem('dfw_temp_phone', phone);

    const items   = Object.values(cart);
    const total   = cartTotal();
    const orderId = 'DFW-' + Date.now().toString().slice(-8);

    // Save to Firestore
    try {
      const fb = window._dfw_firebase;
      if (fb) {
        const user = fb.getUser();
        await fb.addDoc(fb.collection(fb.db,'orders'),{
          orderId, customerName:name, customerPhone:phone, note, items, total, status:'New',
          placedAt:fb.serverTimestamp(), updatedAt:fb.serverTimestamp(),
          customerEmail:user?user.email:null, customerUid:user?user.uid:null,
        });
      }
    } catch(e){ console.warn('Order save failed:',e); }

    const message = dfw_buildOrderMessage({ orderId, items, customerName:name, customerPhone:phone, note, total });
    window.open('https://wa.me/'+settings.whatsapp+'?text='+encodeURIComponent(message),'_blank');

    document.getElementById('modalOrderId').textContent = 'Order ID: '+orderId;
    document.getElementById('modalSummary').innerHTML = items.map(i=>
      `<div><span>${i.name} ×${i.qty}</span><b>${dfw_formatINR(i.price*i.qty)}</b></div>`
    ).join('') + `<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;"><span>Total</span><b>${dfw_formatINR(total)}</b></div>`;
    document.getElementById('modalOverlay').classList.add('show');

    sendBtn.disabled=false; sendBtn.textContent='📩 Send Order on WhatsApp';
    cart={}; dfw_saveCart(cart); renderDrawer(); renderProducts(); closeDrawer();
  }

  document.getElementById('modalCloseBtn').addEventListener('click',()=>{
    document.getElementById('modalOverlay').classList.remove('show');
  });

})();
</script>
<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
                              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, addDoc, serverTimestamp }
                              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { firebaseConfig }   from './firebase-config.js';
const app=initializeApp(firebaseConfig);
const auth=getAuth(app); const db=getFirestore(app);
const provider=new GoogleAuthProvider();
let _currentUser=null;
onAuthStateChanged(auth,u=>{ _currentUser=u; });
// Expose to IIFE scope via window
window._dfw_firebase={ auth, db, provider, getUser:()=>_currentUser,
  addDoc, collection, serverTimestamp };
</script>
</body>
</html>
